<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>คลังรูปภาพกิจกรรม</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    // ═══════════════════════════════════════════════════
    //  ⚙️ CONFIG — แก้ไขค่านี้ก่อนใช้งาน
    // ═══════════════════════════════════════════════════
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwUUJq_MwfVE7Tb4fowyy3Nz0d2fo12wGXMLd1h_PcWIfqlMiHCIfp_Ln6atkBjPdMl/exec';
    //  ตัวอย่าง: 'https://script.google.com/macros/s/AKfycb.../exec'
    // ═══════════════════════════════════════════════════

    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            prompt : ['Prompt', 'sans-serif'],
            kanit  : ['Kanit',  'sans-serif'],
          },
          colors: {
            navy  : { 800: '#1e3a5f', 900: '#142740' },
            gold  : { 400: '#f5c842', 500: '#e6b800' },
          },
          animation: {
            'fade-up'   : 'fadeUp 0.5s ease forwards',
            'shimmer'   : 'shimmer 1.6s infinite',
          },
          keyframes: {
            fadeUp : {
              '0%'   : { opacity: 0, transform: 'translateY(20px)' },
              '100%' : { opacity: 1, transform: 'translateY(0)'    },
            },
            shimmer: {
              '0%'   : { backgroundPosition: '-200% 0' },
              '100%' : { backgroundPosition:  '200% 0' },
            },
          },
        },
      },
    };
  </script>

  <style>
    /* ── Base ── */
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Prompt', sans-serif; }

    /* ── Hero gradient ── */
    .hero-gradient {
      background: linear-gradient(135deg, #142740 0%, #1e3a5f 50%, #2a5298 100%);
    }

    /* ── Card hover ── */
    .gallery-card {
      transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), box-shadow 0.3s ease;
    }
    .gallery-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0,0,0,.18);
    }
    .gallery-card:hover .card-img { transform: scale(1.07); }
    .card-img { transition: transform 0.4s ease; }

    /* ── Skeleton shimmer ── */
    .skeleton {
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite;
    }

    /* ── Lightbox ── */
    #lightbox { transition: opacity 0.3s ease; }
    #lightbox.hidden { pointer-events: none; }
    #lb-img {
      transition: transform 0.35s cubic-bezier(.34,1.2,.64,1), opacity 0.3s ease;
    }
    #lb-img.loading { opacity: 0; transform: scale(0.93); }

    /* ── Category pill active ── */
    .cat-btn.active {
      background: #1e3a5f;
      color: #f5c842;
      border-color: #1e3a5f;
    }

    /* ── Scroll bar ── */
    ::-webkit-scrollbar       { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 9px; }

    /* ── Stagger animation ── */
    .stagger { opacity: 0; animation: fadeUp 0.5s ease forwards; }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- ══════════════ HERO HEADER ══════════════ -->
  <header class="hero-gradient text-white relative overflow-hidden">
    <!-- Decorative circles -->
    <div class="absolute -top-16 -right-16 w-72 h-72 rounded-full bg-white/5 pointer-events-none"></div>
    <div class="absolute bottom-0  -left-10  w-48 h-48 rounded-full bg-white/5 pointer-events-none"></div>

    <div class="relative z-10 max-w-6xl mx-auto px-4 py-12 text-center">
      <!-- Icon -->
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gold-400 mb-5 shadow-lg">
        <svg class="w-8 h-8 text-navy-900" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
      </div>

      <h1 class="text-3xl sm:text-4xl font-bold tracking-wide mb-2">คลังรูปภาพกิจกรรม</h1>
      <p class="text-blue-200 font-light text-sm sm:text-base" id="subtitle">กำลังโหลดข้อมูล...</p>

      <!-- Search -->
      <div class="mt-8 max-w-md mx-auto relative">
        <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
        </svg>
        <input
          id="search-input"
          type="text"
          placeholder="ค้นหากิจกรรม..."
          class="w-full pl-10 pr-4 py-3 rounded-xl bg-white/10 backdrop-blur border border-white/20 text-white placeholder-blue-200 focus:outline-none focus:bg-white/20 focus:border-gold-400 transition font-prompt text-sm"
        />
      </div>
    </div>
  </header>

  <!-- ══════════════ CATEGORY FILTER ══════════════ -->
  <section class="sticky top-0 z-30 bg-white/80 backdrop-blur border-b border-slate-200 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 overflow-x-auto">
      <div id="category-bar" class="flex gap-2 items-center min-w-max">
        <button
          data-cat="ทั้งหมด"
          class="cat-btn active flex-shrink-0 px-4 py-1.5 rounded-full border border-slate-300 text-sm font-medium transition hover:border-navy-800"
          onclick="filterByCategory('ทั้งหมด')"
        >ทั้งหมด</button>
        <!-- หมวดหมู่เพิ่มเติมจะถูก inject ที่นี่ -->
      </div>
    </div>
  </section>

  <!-- ══════════════ MAIN CONTENT ══════════════ -->
  <main class="max-w-6xl mx-auto px-4 py-10">

    <!-- Stats bar -->
    <div id="stats-bar" class="flex items-center justify-between mb-6 text-sm text-slate-500 hidden">
      <span id="stats-text"></span>
      <button onclick="refreshData()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 transition text-slate-600 text-xs font-medium">
        <svg id="refresh-icon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582M20 20v-5h-.581M5.635 19A9 9 0 1 0 4.582 9"/>
        </svg>
        รีเฟรช
      </button>
    </div>

    <!-- Grid -->
    <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    <!-- Empty state -->
    <div id="empty-state" class="hidden text-center py-24">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-slate-100 mb-4">
        <svg class="w-10 h-10 text-slate-300" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909M3 21l6.75-6.75M21 3l-6.75 6.75"/>
        </svg>
      </div>
      <h3 class="text-lg font-semibold text-slate-400 mb-1">ไม่พบรูปภาพ</h3>
      <p class="text-slate-400 text-sm" id="empty-msg">ไม่มีกิจกรรมในหมวดหมู่นี้</p>
    </div>

    <!-- Error state -->
    <div id="error-state" class="hidden text-center py-24">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-red-50 mb-4">
        <svg class="w-10 h-10 text-red-300" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
        </svg>
      </div>
      <h3 class="text-lg font-semibold text-red-400 mb-1">เกิดข้อผิดพลาด</h3>
      <p class="text-slate-400 text-sm" id="error-msg">ไม่สามารถโหลดข้อมูลได้</p>
      <button onclick="refreshData()" class="mt-4 px-5 py-2 rounded-xl bg-navy-800 text-white text-sm font-medium hover:bg-navy-900 transition">ลองอีกครั้ง</button>
    </div>

  </main>

  <!-- ══════════════ LIGHTBOX MODAL ══════════════ -->
  <div
    id="lightbox"
    class="hidden fixed inset-0 z-50 flex items-center justify-center p-4"
    style="background:rgba(10,20,40,.92)"
    onclick="closeLightbox(event)"
    role="dialog" aria-modal="true" aria-label="รูปภาพขยาย"
  >
    <!-- Close button -->
    <button
      onclick="closeLightbox()"
      class="absolute top-4 right-4 w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white transition z-10"
      aria-label="ปิด"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>

    <!-- Prev / Next -->
    <button id="lb-prev" onclick="navigateLightbox(-1)" class="absolute left-2 sm:left-6 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/10 hover:bg-white/25 flex items-center justify-center text-white transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <button id="lb-next" onclick="navigateLightbox(1)"  class="absolute right-2 sm:right-6 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/10 hover:bg-white/25 flex items-center justify-center text-white transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
    </button>

    <!-- Content -->
    <div
      class="relative max-w-4xl w-full mx-auto flex flex-col sm:flex-row gap-0 rounded-2xl overflow-hidden shadow-2xl"
      onclick="event.stopPropagation()"
    >
      <!-- Image side -->
      <div class="sm:w-3/5 bg-black flex items-center justify-center min-h-[260px] sm:min-h-[400px]">
        <img id="lb-img" src="" alt="" class="loading w-full h-full object-contain max-h-[60vh] sm:max-h-[75vh]" />
      </div>

      <!-- Info side -->
      <div class="sm:w-2/5 bg-white p-6 flex flex-col justify-between">
        <div>
          <span id="lb-category" class="inline-block px-3 py-1 rounded-full bg-blue-50 text-blue-700 text-xs font-semibold mb-3"></span>
          <h2 id="lb-title"       class="text-xl font-bold text-navy-900 mb-2 leading-snug"></h2>
          <p  id="lb-date"        class="text-xs text-slate-400 mb-4 flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <span></span>
          </p>
          <p id="lb-description" class="text-slate-600 text-sm leading-relaxed"></p>
        </div>
        <div class="mt-6 pt-4 border-t border-slate-100">
          <span id="lb-counter" class="text-xs text-slate-400"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- ══════════════ TOAST ══════════════ -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none hidden">
    <div class="flex items-center gap-2.5 px-4 py-2.5 rounded-xl shadow-lg bg-navy-900 text-white text-sm font-medium">
      <svg class="w-4 h-4 text-gold-400 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
      </svg>
      <span id="toast-msg"></span>
    </div>
  </div>

  <!-- ══════════════ FOOTER ══════════════ -->
  <footer class="text-center py-8 text-slate-400 text-xs border-t border-slate-200 mt-10">
    คลังรูปภาพกิจกรรม &bull; พัฒนาด้วย Google Apps Script + GitHub Pages
  </footer>

  <!-- ══════════════ JAVASCRIPT ══════════════ -->
  <script>
    // ─────────────────────────────────────────
    //  State
    // ─────────────────────────────────────────
    let allItems      = [];
    let filtered      = [];
    let currentCat    = 'ทั้งหมด';
    let searchQuery   = '';
    let lbIndex       = 0;

    // ─────────────────────────────────────────
    //  Init
    // ─────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      setupSearch();
      loadGallery();
    });

    // ─────────────────────────────────────────
    //  Load data
    // ─────────────────────────────────────────
    async function loadGallery() {
      showSkeletons();
      hideStates();

      try {
        // หาก GAS_URL ยังไม่ได้ตั้งค่า → ใช้ข้อมูล Demo
        if (!GAS_URL || GAS_URL.includes('YOUR_')) {
          await simulateDelay(800);
          const demo = getDemoData();
          processData(demo);
          showToast('โหมด Demo — กรุณาตั้งค่า GAS_URL');
          return;
        }

        const res  = await fetch(`${GAS_URL}?action=getGallery`);
        const json = await res.json();

        if (!json.success) throw new Error(json.message || 'Server error');
        processData(json.data);
      } catch (err) {
        console.error(err);
        showError(err.message || 'ไม่สามารถเชื่อมต่อได้');
      }
    }

    function processData(items) {
      allItems = items;
      buildCategoryBar();
      applyFilters();

      const total = allItems.length;
      document.getElementById('subtitle').textContent =
        `รูปภาพกิจกรรมทั้งหมด ${total.toLocaleString()} รายการ`;
      document.getElementById('stats-bar').classList.remove('hidden');
    }

    // ─────────────────────────────────────────
    //  Render Grid
    // ─────────────────────────────────────────
    function renderGrid(items) {
      const grid = document.getElementById('gallery-grid');
      grid.innerHTML = '';

      if (!items.length) {
        showEmpty();
        return;
      }

      hideStates();
      items.forEach((item, i) => {
        const card = createCard(item, i);
        grid.appendChild(card);
        // Stagger animation
        setTimeout(() => card.classList.add('animate-fade-up'), i * 60);
      });

      updateStats(items.length);
    }

    function createCard(item, idx) {
      const div = document.createElement('div');
      div.className = 'gallery-card stagger bg-white rounded-2xl overflow-hidden shadow-md cursor-pointer';
      div.style.animationDelay = `${idx * 60}ms`;
      div.setAttribute('tabindex', '0');
      div.setAttribute('role', 'button');
      div.setAttribute('aria-label', item.title);

      const placeholder = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iODAwIiBoZWlnaHQ9IjYwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZTJlOGYwIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtc2l6ZT0iMjQiIGZpbGw9IiM5NGEzYjgiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj7wn5KMPC90ZXh0Pjwvc3ZnPg==';

      div.innerHTML = `
        <div class="overflow-hidden h-52 bg-slate-100">
          <img
            class="card-img w-full h-full object-cover"
            src="${placeholder}"
            data-src="${item.imageUrl || placeholder}"
            alt="${item.title}"
            onerror="this.src='${placeholder}'"
          />
        </div>
        <div class="p-4">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-blue-50 text-blue-700">${item.category}</span>
            <span class="text-xs text-slate-400">${item.date}</span>
          </div>
          <h3 class="font-semibold text-navy-900 text-sm leading-snug line-clamp-2 mb-1">${item.title}</h3>
          <p  class="text-slate-500 text-xs leading-relaxed line-clamp-2">${item.description || '-'}</p>
        </div>
      `;

      div.addEventListener('click', () => openLightbox(idx));
      div.addEventListener('keydown', e => { if (e.key === 'Enter') openLightbox(idx); });

      // Lazy load image
      observeImage(div.querySelector('img'));

      return div;
    }

    // ─────────────────────────────────────────
    //  Lazy Load (IntersectionObserver)
    // ─────────────────────────────────────────
    const imgObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target;
          img.src = img.dataset.src;
          imgObserver.unobserve(img);
        }
      });
    }, { rootMargin: '200px' });

    function observeImage(img) {
      if (img) imgObserver.observe(img);
    }

    // ─────────────────────────────────────────
    //  Lightbox
    // ─────────────────────────────────────────
    function openLightbox(idx) {
      lbIndex = idx;
      renderLightbox();
      document.getElementById('lightbox').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function renderLightbox() {
      const item = filtered[lbIndex];
      if (!item) return;

      const img = document.getElementById('lb-img');
      img.classList.add('loading');
      img.src = item.imageUrl;
      img.alt = item.title;
      img.onload = () => img.classList.remove('loading');
      img.onerror = () => { img.src = ''; img.classList.remove('loading'); };

      document.getElementById('lb-category').textContent    = item.category;
      document.getElementById('lb-title').textContent       = item.title;
      document.getElementById('lb-date').querySelector('span').textContent = item.date;
      document.getElementById('lb-description').textContent = item.description || '-';
      document.getElementById('lb-counter').textContent     = `${lbIndex + 1} / ${filtered.length}`;

      // Prev/Next visibility
      document.getElementById('lb-prev').style.opacity = lbIndex === 0                 ? '0.3' : '1';
      document.getElementById('lb-next').style.opacity = lbIndex === filtered.length-1 ? '0.3' : '1';
    }

    function closeLightbox(event) {
      if (event && event.target !== document.getElementById('lightbox')) return;
      document.getElementById('lightbox').classList.add('hidden');
      document.body.style.overflow = '';
    }

    function navigateLightbox(dir) {
      const next = lbIndex + dir;
      if (next < 0 || next >= filtered.length) return;
      lbIndex = next;
      renderLightbox();
    }

    // Keyboard nav
    document.addEventListener('keydown', e => {
      const lb = document.getElementById('lightbox');
      if (lb.classList.contains('hidden')) return;
      if (e.key === 'Escape')      { lb.classList.add('hidden'); document.body.style.overflow = ''; }
      if (e.key === 'ArrowLeft')   navigateLightbox(-1);
      if (e.key === 'ArrowRight')  navigateLightbox(1);
    });

    // ─────────────────────────────────────────
    //  Category Filter
    // ─────────────────────────────────────────
    function buildCategoryBar() {
      const bar  = document.getElementById('category-bar');
      const cats = [...new Set(allItems.map(i => i.category))].sort();
      const all  = bar.querySelector('[data-cat="ทั้งหมด"]');

      // ลบปุ่มเก่า (ยกเว้น "ทั้งหมด")
      [...bar.querySelectorAll('[data-cat]:not([data-cat="ทั้งหมด"])')].forEach(b => b.remove());

      cats.forEach(cat => {
        const btn = document.createElement('button');
        btn.dataset.cat  = cat;
        btn.textContent  = cat;
        btn.className    = 'cat-btn flex-shrink-0 px-4 py-1.5 rounded-full border border-slate-300 text-sm font-medium transition hover:border-navy-800';
        btn.onclick      = () => filterByCategory(cat);
        bar.appendChild(btn);
      });
    }

    function filterByCategory(cat) {
      currentCat = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
      applyFilters();
    }

    // ─────────────────────────────────────────
    //  Search
    // ─────────────────────────────────────────
    function setupSearch() {
      const input = document.getElementById('search-input');
      let debounceTimer;
      input.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          searchQuery = input.value.trim().toLowerCase();
          applyFilters();
        }, 280);
      });
    }

    // ─────────────────────────────────────────
    //  Combined Filter
    // ─────────────────────────────────────────
    function applyFilters() {
      filtered = allItems.filter(item => {
        const matchCat    = currentCat === 'ทั้งหมด' || item.category === currentCat;
        const matchSearch = !searchQuery ||
          item.title.toLowerCase().includes(searchQuery) ||
          item.description.toLowerCase().includes(searchQuery) ||
          item.category.toLowerCase().includes(searchQuery);
        return matchCat && matchSearch;
      });
      renderGrid(filtered);
    }

    // ─────────────────────────────────────────
    //  Skeleton Loaders
    // ─────────────────────────────────────────
    function showSkeletons(count = 6) {
      const grid = document.getElementById('gallery-grid');
      grid.innerHTML = Array.from({ length: count }).map(() => `
        <div class="bg-white rounded-2xl overflow-hidden shadow-md">
          <div class="skeleton h-52 w-full"></div>
          <div class="p-4 space-y-2">
            <div class="skeleton h-4 w-1/3 rounded-full"></div>
            <div class="skeleton h-4 w-full rounded"></div>
            <div class="skeleton h-4 w-2/3 rounded"></div>
          </div>
        </div>
      `).join('');
    }

    // ─────────────────────────────────────────
    //  UI State helpers
    // ─────────────────────────────────────────
    function hideStates() {
      ['empty-state','error-state'].forEach(id => document.getElementById(id).classList.add('hidden'));
    }

    function showEmpty(msg = 'ไม่มีกิจกรรมในหมวดหมู่นี้') {
      document.getElementById('gallery-grid').innerHTML = '';
      document.getElementById('empty-msg').textContent  = msg;
      document.getElementById('empty-state').classList.remove('hidden');
    }

    function showError(msg) {
      document.getElementById('gallery-grid').innerHTML = '';
      document.getElementById('error-msg').textContent  = msg;
      document.getElementById('error-state').classList.remove('hidden');
      document.getElementById('subtitle').textContent   = 'เกิดข้อผิดพลาด';
    }

    function updateStats(count) {
      const q = searchQuery || currentCat !== 'ทั้งหมด';
      document.getElementById('stats-text').textContent = q
        ? `แสดง ${count} รายการ (จากทั้งหมด ${allItems.length} รายการ)`
        : `ทั้งหมด ${count} รายการ`;
    }

    // ─────────────────────────────────────────
    //  Toast
    // ─────────────────────────────────────────
    function showToast(msg, ms = 3000) {
      const t = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), ms);
    }

    // ─────────────────────────────────────────
    //  Refresh
    // ─────────────────────────────────────────
    async function refreshData() {
      const icon = document.getElementById('refresh-icon');
      icon.classList.add('animate-spin');
      await loadGallery();
      icon.classList.remove('animate-spin');
      showToast('อัปเดตข้อมูลเรียบร้อย');
    }

    // ─────────────────────────────────────────
    //  Helpers
    // ─────────────────────────────────────────
    function simulateDelay(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    // ─────────────────────────────────────────
    //  Demo Data (ใช้เมื่อยังไม่ได้ตั้งค่า GAS_URL)
    // ─────────────────────────────────────────
    function getDemoData() {
      const cats  = ['ประชุม','อบรม','กิจกรรม','ดูงาน','สังสรรค์'];
      const seeds = ['activity','meeting','office','team','event','training','study','work','conference','party'];
      return Array.from({ length: 12 }, (_, i) => ({
        id          : i + 1,
        date        : `${1 + (i%28)} ${['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน'][i%6]} ${2568 - Math.floor(i/12)}`,
        title       : `กิจกรรมตัวอย่างที่ ${i + 1} — ${cats[i % cats.length]}`,
        description : 'นี่คือคำอธิบายกิจกรรมตัวอย่าง สำหรับทดสอบการแสดงผลของระบบ สามารถแก้ไขเนื้อหาได้จาก Google Sheet',
        category    : cats[i % cats.length],
        imageUrl    : `https://picsum.photos/seed/${seeds[i % seeds.length]}${i}/800/600`,
        status      : 'แสดง',
      }));
    }
  </script>
</body>
</html>
